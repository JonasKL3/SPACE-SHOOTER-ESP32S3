name: Replace corrected v6.5.6 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-corrected-v6.5.6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace original v6.5.6 with verified Arduino hotfix
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_OLD_TAG: 908a538513031896284522409418399448964c1d
        shell: bash
        run: |
          set -euo pipefail
          tag=v6.5.6
          source_path=firmware/SPACE_SHOOTER_ESP32S3/SPACE_SHOOTER_ESP32S3.ino
          mkdir -p dist
          test "$(cat VERSION)" = '6.5.6'
          grep -Fq '#define GAME_VERSION "v6.5.6"' "$source_path"
          grep -Fq 'void feedKonami(int k) {' "$source_path"
          if grep -Fq 'void feedKonami(KonamiKey k)' "$source_path"; then
            echo 'ERROR: old Arduino-incompatible signature still present'; exit 1
          fi
          # Build and checksum BEFORE deleting any previous release.
          zip=dist/SPACE-SHOOTER-ESP32S3-v6.5.6-SOURCE.zip
          git archive --format=zip --output="$zip" "$GITHUB_SHA"
          unzip -p "$zip" "$source_path" | grep -Fq 'void feedKonami(int k) {'
          sha256sum "$zip" > "$zip.sha256"
          sha256sum -c "$zip.sha256"
          # Check previous/current tag. Never overwrite an unrelated version.
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null | grep -E '^[a-f0-9]{40}$' || true)
          if [[ "$tag_sha" == "$GITHUB_SHA" ]] && gh release view "$tag" >/dev/null 2>&1; then
            echo 'Corrected release already published; nothing to do.'
            exit 0
          fi
          if [[ -n "$tag_sha" && "$tag_sha" != "$EXPECTED_OLD_TAG" && "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "ERROR: unexpected tag target $tag_sha"; exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Removing previous v6.5.6 Release (preserving old commit history)'
            gh release delete "$tag" --yes
          fi
          if [[ -n "$tag_sha" && "$tag_sha" != "$GITHUB_SHA" ]]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" >/dev/null
            tag_sha=''
          fi
          if [[ -z "$tag_sha" ]]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${tag}" -f sha="$GITHUB_SHA" >/dev/null
          fi
          gh release create "$tag" "$zip" "$zip.sha256" \
            --verify-tag --target "$GITHUB_SHA" \
            --title 'SPACE SHOOTER v6.5.6 — Arduino IDE Hotfix' \
            --notes-file docs/RELEASE_NOTES_V6.5.6.md --latest
          echo 'Release v6.5.6 replaced with confirmed hotfix.'
